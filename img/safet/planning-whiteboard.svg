<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="#F7F0E3" rx="8"/>
  <!-- Paper texture lines -->
  <g opacity="0.1" stroke="#999" stroke-width="0.5">
    <line x1="0" y1="50" x2="800" y2="50"/>
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="250" x2="800" y2="250"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="350" x2="800" y2="350"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="450" x2="800" y2="450"/>
  </g>

  <!-- Header: Hardware -->
  <text x="40" y="45" fill="#222" font-family="'Caveat', cursive, sans-serif" font-size="20" font-weight="700">1) Hardware</text>
  <text x="120" y="80" fill="#333" font-family="'Caveat', cursive, sans-serif" font-size="16">Jewellery &rarr; 3D Print Necklace</text>
  <text x="120" y="110" fill="#333" font-family="'Caveat', cursive, sans-serif" font-size="16">Arduino / Particle Sensors / Connect 2 devices</text>

  <!-- Device 1 Box -->
  <rect x="60" y="130" width="240" height="170" rx="6" fill="none" stroke="#444" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="80" y="155" fill="#222" font-family="'Caveat', cursive, sans-serif" font-size="16" font-weight="600">Device 1 (Necklace)</text>
  <text x="80" y="180" fill="#555" font-family="'Caveat', cursive, sans-serif" font-size="14">1) Temp Button</text>
  <text x="80" y="200" fill="#555" font-family="'Caveat', cursive, sans-serif" font-size="14">2) Light (Green LED)</text>
  <text x="80" y="220" fill="#555" font-family="'Caveat', cursive, sans-serif" font-size="14">3) Temperature Sensor</text>
  <text x="80" y="240" fill="#555" font-family="'Caveat', cursive, sans-serif" font-size="14">4) Heart/Pulse Rate</text>
  <text x="80" y="260" fill="#555" font-family="'Caveat', cursive, sans-serif" font-size="14">5) GPS Module</text>
  <text x="80" y="280" fill="#555" font-family="'Caveat', cursive, sans-serif" font-size="14">6) Voice AI Agent</text>

  <!-- Arrow: Need Help -->
  <line x1="310" y1="175" x2="440" y2="175" stroke="#D44" stroke-width="2" marker-end="url(#arrowR)"/>
  <text x="340" y="168" fill="#D44" font-family="'Caveat', cursive, sans-serif" font-size="13" font-weight="600">Need help</text>

  <!-- Arrow: Help coming -->
  <line x1="440" y1="210" x2="310" y2="210" stroke="#4A4" stroke-width="2" marker-end="url(#arrowL)"/>
  <text x="330" y="230" fill="#4A4" font-family="'Caveat', cursive, sans-serif" font-size="13" font-weight="600">Help is coming</text>

  <!-- Device 2 Box -->
  <rect x="450" y="130" width="240" height="170" rx="6" fill="none" stroke="#444" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="470" y="155" fill="#222" font-family="'Caveat', cursive, sans-serif" font-size="16" font-weight="600">Device 2 (Ring)</text>
  <text x="470" y="180" fill="#555" font-family="'Caveat', cursive, sans-serif" font-size="14">Sound &amp; Red Light</text>
  <text x="470" y="200" fill="#555" font-family="'Caveat', cursive, sans-serif" font-size="14">Button</text>
  <text x="470" y="220" fill="#555" font-family="'Caveat', cursive, sans-serif" font-size="14">Vibration</text>
  <text x="470" y="250" fill="#888" font-family="'Caveat', cursive, sans-serif" font-size="13" font-style="italic">Synced both ways</text>

  <!-- Software Section -->
  <text x="40" y="340" fill="#222" font-family="'Caveat', cursive, sans-serif" font-size="20" font-weight="700">2) Software</text>
  <text x="120" y="370" fill="#333" font-family="'Caveat', cursive, sans-serif" font-size="16">Website &mdash; Dashboard for historical data</text>
  <text x="120" y="395" fill="#555" font-family="'Caveat', cursive, sans-serif" font-size="14">&bull; What data &rarr; "go to doctor" alerts</text>
  <text x="120" y="415" fill="#555" font-family="'Caveat', cursive, sans-serif" font-size="14">&bull; Set up Accounts &amp; share with friends/family</text>
  <text x="120" y="435" fill="#555" font-family="'Caveat', cursive, sans-serif" font-size="14">&bull; Voice AI recording &amp; distress detection</text>

  <!-- Presentation -->
  <text x="40" y="475" fill="#222" font-family="'Caveat', cursive, sans-serif" font-size="20" font-weight="700">3) Presentation / Video &mdash; Slides</text>

  <!-- Notifications arrow -->
  <path d="M650,240 Q700,280 650,330" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrowR)"/>
  <text x="660" y="290" fill="#666" font-family="'Caveat', cursive, sans-serif" font-size="12">Notifications</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrowR" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
    <marker id="arrowL" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="10 0, 0 3.5, 10 7" fill="#666"/>
    </marker>
  </defs>
</svg>
