<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1B2A;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1B2838;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00B4D8;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0077B5;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#48CAE4"/>
      <stop offset="100%" style="stop-color:#0096C7"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)" rx="12"/>

  <!-- Grid pattern -->
  <g opacity="0.05" stroke="#fff" stroke-width="0.5">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
  </g>

  <!-- Device 1: Necklace pendant -->
  <g transform="translate(180, 130)">
    <!-- String -->
    <path d="M60,0 Q60,-30 80,-50 Q120,-80 160,-50 Q180,-30 180,0" fill="none" stroke="#666" stroke-width="2"/>
    <!-- Pendant body -->
    <rect x="70" y="0" width="100" height="100" rx="14" fill="#2D3748" stroke="#4A5568" stroke-width="1.5"/>
    <!-- LED indicators -->
    <circle cx="100" cy="30" r="5" fill="#48BB78" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.4;0.9" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="140" cy="30" r="5" fill="#FC8181" opacity="0.4"/>
    <!-- Button -->
    <circle cx="120" cy="65" r="10" fill="#1A202C" stroke="#4A5568" stroke-width="1"/>
    <!-- Sensor dots -->
    <rect x="85" y="82" width="8" height="8" rx="2" fill="#4A5568"/>
    <rect x="147" y="82" width="8" height="8" rx="2" fill="#4A5568"/>
    <text x="120" y="125" text-anchor="middle" fill="#A0AEC0" font-family="Inter, sans-serif" font-size="11" font-weight="500">DEVICE 1</text>
    <text x="120" y="140" text-anchor="middle" fill="#718096" font-family="Inter, sans-serif" font-size="9">Necklace</text>
  </g>

  <!-- Connection wave lines -->
  <g transform="translate(380, 180)">
    <path d="M0,20 Q20,0 40,20 Q60,40 80,20" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="1.5s" repeatCount="indefinite"/>
    </path>
    <path d="M0,40 Q20,20 40,40 Q60,60 80,40" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.4">
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="1.5s" begin="0.3s" repeatCount="indefinite"/>
    </path>
    <text x="40" y="75" text-anchor="middle" fill="#48CAE4" font-family="Inter, sans-serif" font-size="10" font-weight="600">SYNCED</text>
  </g>

  <!-- Device 2: Ring -->
  <g transform="translate(480, 150)">
    <!-- Ring shape -->
    <ellipse cx="100" cy="50" rx="50" ry="55" fill="none" stroke="#2D3748" stroke-width="18"/>
    <ellipse cx="100" cy="50" rx="50" ry="55" fill="none" stroke="#4A5568" stroke-width="16"/>
    <!-- LED on ring -->
    <circle cx="100" cy="-3" r="4" fill="#FC8181" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
    <!-- Vibration indicator -->
    <path d="M60,50 L55,45 M60,50 L55,55" stroke="#A0AEC0" stroke-width="1.5" opacity="0.5">
      <animate attributeName="opacity" values="0.5;0;0.5" dur="1s" repeatCount="indefinite"/>
    </path>
    <text x="100" y="125" text-anchor="middle" fill="#A0AEC0" font-family="Inter, sans-serif" font-size="11" font-weight="500">DEVICE 2</text>
    <text x="100" y="140" text-anchor="middle" fill="#718096" font-family="Inter, sans-serif" font-size="9">Ring</text>
  </g>

  <!-- Voice AI indicator -->
  <g transform="translate(310, 320)">
    <rect x="0" y="0" width="180" height="60" rx="10" fill="#1A365D" stroke="#2A4365" stroke-width="1"/>
    <!-- Sound wave icon -->
    <g transform="translate(20, 15)">
      <rect x="0" y="12" width="3" height="6" rx="1" fill="#48CAE4">
        <animate attributeName="height" values="6;16;6" dur="0.8s" repeatCount="indefinite"/>
        <animate attributeName="y" values="12;7;12" dur="0.8s" repeatCount="indefinite"/>
      </rect>
      <rect x="6" y="8" width="3" height="14" rx="1" fill="#48CAE4">
        <animate attributeName="height" values="14;6;14" dur="0.8s" begin="0.2s" repeatCount="indefinite"/>
        <animate attributeName="y" values="8;12;8" dur="0.8s" begin="0.2s" repeatCount="indefinite"/>
      </rect>
      <rect x="12" y="5" width="3" height="20" rx="1" fill="#48CAE4">
        <animate attributeName="height" values="20;8;20" dur="0.8s" begin="0.1s" repeatCount="indefinite"/>
        <animate attributeName="y" values="5;11;5" dur="0.8s" begin="0.1s" repeatCount="indefinite"/>
      </rect>
      <rect x="18" y="10" width="3" height="10" rx="1" fill="#48CAE4">
        <animate attributeName="height" values="10;18;10" dur="0.8s" begin="0.3s" repeatCount="indefinite"/>
        <animate attributeName="y" values="10;6;10" dur="0.8s" begin="0.3s" repeatCount="indefinite"/>
      </rect>
    </g>
    <text x="55" y="25" fill="#E2E8F0" font-family="Inter, sans-serif" font-size="11" font-weight="600">Voice AI Agent</text>
    <text x="55" y="42" fill="#718096" font-family="Inter, sans-serif" font-size="9">Always-on recording</text>
  </g>

  <!-- Sensor labels -->
  <g transform="translate(50, 330)">
    <rect x="0" y="0" width="120" height="24" rx="12" fill="#234E52" opacity="0.8"/>
    <text x="60" y="16" text-anchor="middle" fill="#81E6D9" font-family="Inter, sans-serif" font-size="9" font-weight="500">Temperature</text>
  </g>
  <g transform="translate(50, 360)">
    <rect x="0" y="0" width="120" height="24" rx="12" fill="#234E52" opacity="0.8"/>
    <text x="60" y="16" text-anchor="middle" fill="#81E6D9" font-family="Inter, sans-serif" font-size="9" font-weight="500">Heart Rate</text>
  </g>
  <g transform="translate(50, 390)">
    <rect x="0" y="0" width="120" height="24" rx="12" fill="#234E52" opacity="0.8"/>
    <text x="60" y="16" text-anchor="middle" fill="#81E6D9" font-family="Inter, sans-serif" font-size="9" font-weight="500">GPS Location</text>
  </g>
  <g transform="translate(50, 420)">
    <rect x="0" y="0" width="120" height="24" rx="12" fill="#234E52" opacity="0.8"/>
    <text x="60" y="16" text-anchor="middle" fill="#81E6D9" font-family="Inter, sans-serif" font-size="9" font-weight="500">Humidity</text>
  </g>

  <!-- Cloud/Dashboard indicator -->
  <g transform="translate(560, 320)">
    <rect x="0" y="0" width="180" height="60" rx="10" fill="#1A365D" stroke="#2A4365" stroke-width="1"/>
    <!-- Dashboard icon -->
    <g transform="translate(15, 12)">
      <rect x="0" y="0" width="12" height="12" rx="2" fill="#48CAE4" opacity="0.7"/>
      <rect x="15" y="0" width="12" height="5" rx="1" fill="#48CAE4" opacity="0.5"/>
      <rect x="15" y="8" width="12" height="4" rx="1" fill="#48CAE4" opacity="0.3"/>
      <rect x="0" y="15" width="27" height="4" rx="1" fill="#48CAE4" opacity="0.4"/>
    </g>
    <text x="55" y="25" fill="#E2E8F0" font-family="Inter, sans-serif" font-size="11" font-weight="600">Cloud Dashboard</text>
    <text x="55" y="42" fill="#718096" font-family="Inter, sans-serif" font-size="9">Historical data &amp; alerts</text>
  </g>

  <!-- Title -->
  <text x="400" y="465" text-anchor="middle" fill="#E2E8F0" font-family="Inter, sans-serif" font-size="16" font-weight="700" letter-spacing="2">SafeT — TRAVEL SAFETY ACCESSORIES</text>
  <text x="400" y="485" text-anchor="middle" fill="#718096" font-family="Inter, sans-serif" font-size="10">IoT · Voice AI · 3D Printing · Cloud · Particle Argon</text>
</svg>
