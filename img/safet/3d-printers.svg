<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="workbench" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8B7355"/>
      <stop offset="100%" style="stop-color:#6B5340"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="#2D2D2D" rx="8"/>

  <!-- Workbench surface -->
  <rect x="0" y="320" width="800" height="130" fill="url(#workbench)"/>

  <!-- Printer 1 -->
  <g transform="translate(80, 40)">
    <!-- Frame -->
    <rect x="0" y="0" width="10" height="280" fill="#333" rx="2"/>
    <rect x="240" y="0" width="10" height="280" fill="#333" rx="2"/>
    <rect x="0" y="0" width="250" height="10" fill="#333" rx="2"/>
    <!-- PRUSA text -->
    <text x="50" y="8" fill="#F47023" font-family="sans-serif" font-size="9" font-weight="800" letter-spacing="3">PRUSA</text>
    <!-- Z-axis rods -->
    <rect x="20" y="10" width="6" height="270" fill="#C0C0C0" rx="3"/>
    <rect x="224" y="10" width="6" height="270" fill="#C0C0C0" rx="3"/>
    <!-- Orange corners -->
    <rect x="-5" y="-5" width="30" height="25" rx="4" fill="#F47023"/>
    <rect x="225" y="-5" width="30" height="25" rx="4" fill="#F47023"/>
    <rect x="-5" y="260" width="30" height="25" rx="4" fill="#F47023"/>
    <rect x="225" y="260" width="30" height="25" rx="4" fill="#F47023"/>
    <!-- Print bed -->
    <rect x="15" y="220" width="220" height="60" rx="3" fill="#2A3A2A" stroke="#444" stroke-width="1"/>
    <!-- Extruder -->
    <rect x="100" y="100" width="50" height="40" rx="4" fill="#333" stroke="#555" stroke-width="1"/>
    <rect x="110" y="85" width="30" height="20" rx="3" fill="#F47023"/>
    <!-- Label -->
    <text x="35" y="300" fill="#999" font-family="sans-serif" font-size="10">ORIGINAL PRUSA i3 MK3</text>
  </g>

  <!-- Printer 2 -->
  <g transform="translate(430, 40)">
    <!-- Frame -->
    <rect x="0" y="0" width="10" height="280" fill="#333" rx="2"/>
    <rect x="240" y="0" width="10" height="280" fill="#333" rx="2"/>
    <rect x="0" y="0" width="250" height="10" fill="#333" rx="2"/>
    <text x="50" y="8" fill="#F47023" font-family="sans-serif" font-size="9" font-weight="800" letter-spacing="3">PRUSA</text>
    <!-- Z-axis rods -->
    <rect x="20" y="10" width="6" height="270" fill="#C0C0C0" rx="3"/>
    <rect x="224" y="10" width="6" height="270" fill="#C0C0C0" rx="3"/>
    <!-- Orange corners -->
    <rect x="-5" y="-5" width="30" height="25" rx="4" fill="#F47023"/>
    <rect x="225" y="-5" width="30" height="25" rx="4" fill="#F47023"/>
    <rect x="-5" y="260" width="30" height="25" rx="4" fill="#F47023"/>
    <rect x="225" y="260" width="30" height="25" rx="4" fill="#F47023"/>
    <!-- Print bed -->
    <rect x="15" y="220" width="220" height="60" rx="3" fill="#2A3A2A" stroke="#444" stroke-width="1"/>
    <!-- Extruder (different position) -->
    <rect x="150" y="130" width="50" height="40" rx="4" fill="#333" stroke="#555" stroke-width="1"/>
    <rect x="160" y="115" width="30" height="20" rx="3" fill="#F47023"/>
    <!-- Label -->
    <text x="35" y="300" fill="#999" font-family="sans-serif" font-size="10">ORIGINAL PRUSA i3 MK3</text>
  </g>

  <!-- Caption -->
  <text x="400" y="430" text-anchor="middle" fill="#CCC" font-family="sans-serif" font-size="13" font-weight="500">Dual 3D printers fabricating SafeT pendant housings simultaneously</text>
</svg>
